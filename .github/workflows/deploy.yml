name: Deploy Web (GitHub Pages)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.6.3

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot + export templates
        run: |
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Import resources
        run: ./godot --headless --path . --import 2>&1 | tail -5 || true

      - name: Export Web
        run: |
          mkdir -p build/web
          ./godot --headless --path . --export-release "Web" build/web/index.html
          ls -la build/web

      - name: Cache-bust filenames (버전별 파일명으로 브라우저 캐시 무력화)
        run: |
          cd build/web
          V="${GITHUB_SHA::8}"
          for ext in js wasm pck audio.worklet.js; do
            if [ -f "index.$ext" ]; then mv "index.$ext" "index.$V.$ext"; fi
          done
          sed -i \
            -e "s/index\.audio\.worklet\.js/index.$V.audio.worklet.js/g" \
            -e "s/index\.pck/index.$V.pck/g" \
            -e "s/index\.wasm/index.$V.wasm/g" \
            -e "s/src=\"index\.js\"/src=\"index.$V.js\"/g" \
            -e "s/\"executable\":\"index\"/\"executable\":\"index.$V\"/g" \
            index.html
          echo "버전 V=$V 적용됨"; ls -la

      - name: Copy OG image into site
        run: cp web/og-image.jpg build/web/og-image.jpg

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
