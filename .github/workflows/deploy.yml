name: Deploy Web (GitHub Pages)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.6.3

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot + export templates
        run: |
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Import resources
        run: ./godot --headless --path . --import 2>&1 | tail -5 || true

      - name: Export Web
        run: |
          mkdir -p build/web
          ./godot --headless --path . --export-release "Web" build/web/index.html
          ls -la build/web

      # ※ 캐시 정책: 파일명을 커밋 SHA로 바꾸지 않는다(안정 파일명 유지).
      #   이유: SHA 리네임은 짧은 시간에 2번 배포하면 "캐시된 옛 index.html이 삭제된 옛 .pck를 찾는"
      #   404를 일으킨다(GitHub Pages는 전체 교체 배포라 옛 SHA 파일이 사라짐).
      #   안정 파일명 = 404 절대 없음. 최신 반영은 GitHub Pages의 ETag 재검증(보통 새로고침이면 최신,
      #   안 되면 강력 새로고침). 빌드 버전은 game_state.gd const BUILD로 시작화면에 표시돼 확인 가능.

      - name: Copy OG image + PWA manifest into site
        run: |
          cp web/og-image.jpg build/web/og-image.jpg
          cp web/manifest.webmanifest build/web/manifest.webmanifest

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
